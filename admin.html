<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yönetim Paneli | Klakz Hub</title><link rel="stylesheet" href="style.css"><style>main{max-width:1100px;margin:48px auto;padding:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}.card,.panel{background:#111827;border:1px solid #273449;border-radius:14px;padding:20px}.card h2{margin-top:0;color:#67e8f9}.card p,.muted{color:#bac5d6;line-height:1.6}.tag{color:#a5b4fc}.notice{padding:12px;color:#86efac}.notice.bad{color:#fca5a5}input,textarea,select{display:block;width:100%;margin:10px 0;padding:12px;border-radius:8px;border:1px solid #475569;background:#0b1220;color:white}button,.button{display:inline-block;padding:10px 15px;border:0;border-radius:8px;background:#4f46e5;color:white;cursor:pointer;text-decoration:none;margin:5px 5px 5px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#080d16;padding:12px;border-radius:8px}nav.open{display:flex!important}header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:16px 5%;gap:14px}nav{display:flex;gap:14px;flex-wrap:wrap}nav a{color:#dbeafe;text-decoration:none}footer{padding:24px;text-align:center;color:#94a3b8} [hidden]{display:none!important}</style><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-functions-compat.js"></script><script src="firebase-config.js" defer></script><script src="site.js" defer></script></head><body data-page="admin"><header><a class="logo" href="index.html">KLAKZ HUB</a><button data-menu aria-label="Menüyü aç">☰</button><nav><a href="index.html">Ana Sayfa</a><a href="script.html">Scriptler</a><a href="downloads.html">İndirmeler</a><a href="executors.html">Executorlar</a><a href="network.html">Projeler</a><a href="status.html">Durum</a><a href="changelog.html">Güncellemeler</a><a href="request.html">İstek</a><a href="admin.html">Yönetim</a></nav></header><main><h1>Yönetim Paneli</h1><p class="muted">Klakz Hub oyun topluluğu</p><div id="notice" class="notice" aria-live="polite"></div><form id="loginForm" class="panel"><h2>Yönetici girişi</h2><label>E-posta<input id="email" type="email" autocomplete="username" required></label><label>Şifre<input id="password" type="password" autocomplete="current-password" required></label><button>Giriş yap</button></form><section id="adminPanel" hidden><button id="logout">Çıkış yap</button><form id="publishForm" class="panel"><h2>İçerik yayınla</h2><label>İçerik türü<select id="type"><option value="scripts">Script</option><option value="downloads">İndirme</option><option value="executors">Executor</option><option value="projects">Proje</option><option value="changelog">Güncelleme</option><option value="statuses">Durum</option></select></label><label>Başlık<input id="name" required maxlength="100"></label><label>Açıklama<textarea id="desc" maxlength="2000"></textarea></label><label>Etiket<input id="tag" maxlength="100"></label><label>Durum metni (durum içerikleri için)<input id="state" maxlength="80" placeholder="Çalışıyor / Bakımda"></label><label>Script kodu (script içerikleri için)<textarea id="code" maxlength="20000" placeholder="Kodunu buraya ekle"></textarea></label><label>İndirme bağlantısı (opsiyonel)<input id="url" type="url" placeholder="https://..."></label><button>Yayınla</button></form><form id="issueKeyForm" class="panel"><h2>Tek kullanımlık Key üret</h2><label>Süre<select id="keyDays"><option value="1">1 gün</option><option value="7">7 gün</option><option value="30" selected>30 gün</option><option value="90">90 gün</option><option value="365">365 gün</option></select></label><button>Key üret</button><div id="keyResult" hidden><p id="issuedDays"></p><code id="issuedKey"></code><button id="copyIssuedKey" type="button">Key kodunu kopyala</button></div></form><h2>Gelen istekler</h2><section id="requests" class="grid"></section></section></main><footer>Klakz Hub · Güvenli kullanım için bilinmeyen dosyaları çalıştırmayın.</footer></body></html>
